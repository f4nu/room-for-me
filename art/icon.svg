<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bezel" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f3d590"/>
      <stop offset="0.3" stop-color="#b98a3e"/>
      <stop offset="0.7" stop-color="#6e4518"/>
      <stop offset="1" stop-color="#3a2108"/>
    </linearGradient>
    <linearGradient id="bezelIn" x1="0.8" y1="1" x2="0.2" y2="0">
      <stop offset="0" stop-color="#d9ab5c"/>
      <stop offset="0.55" stop-color="#7a4c1a"/>
      <stop offset="1" stop-color="#2e1806"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="62%" r="60%">
      <stop offset="0" stop-color="#1a4a3c"/>
      <stop offset="0.55" stop-color="#0c2a22"/>
      <stop offset="1" stop-color="#03100c"/>
    </radialGradient>
    <radialGradient id="heroGold" cx="36%" cy="18%" r="90%">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.2" stop-color="#ffe066"/>
      <stop offset="0.55" stop-color="#f2a516"/>
      <stop offset="1" stop-color="#8a4600"/>
    </radialGradient>
    <linearGradient id="companion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#245a49"/>
      <stop offset="1" stop-color="#0f2e26"/>
    </linearGradient>
    <linearGradient id="beamX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd35a" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffdc78" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#fff8dc" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#ffdc78" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="beamFade" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="42" width="512" height="340" fill="url(#fadeUp)"/>
    </mask>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffc83a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffc83a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4a3c" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#03100c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#03100c" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="badgeFace" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#1d3a31"/>
      <stop offset="1" stop-color="#06120e"/>
    </radialGradient>
    <linearGradient id="badgeRim" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e7c27a"/>
      <stop offset="0.5" stop-color="#9a6a2a"/>
      <stop offset="1" stop-color="#4a2a0a"/>
    </linearGradient>
    <linearGradient id="badgeRimLit" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.45" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#b86a00"/>
    </linearGradient>
    <radialGradient id="face_tank" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5aa8ff"/>
      <stop offset="1" stop-color="#123c86"/>
    </radialGradient>
    <radialGradient id="face_healer" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#6fe05a"/>
      <stop offset="1" stop-color="#0f5a1a"/>
    </radialGradient>
    <radialGradient id="face_dps" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff6a4a"/>
      <stop offset="1" stop-color="#7a120a"/>
    </radialGradient>
    <linearGradient id="symbol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e8ee"/>
    </linearGradient>
    <filter id="blur16" x="-80%" y="-10%" width="260%" height="120%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="blur5" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="inside">
      <circle cx="256" cy="256" r="214"/>
    </clipPath>
  </defs>

  <!-- bezel -->
  <circle cx="256" cy="256" r="251" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="245" fill="url(#bezel)"/>
  <circle cx="256" cy="256" r="226" fill="url(#bezelIn)"/>
  <circle cx="256" cy="256" r="219" fill="#1c0e02"/>
  <circle cx="256" cy="256" r="214" fill="url(#field)"/>

  <g clip-path="url(#inside)">
    <!-- the beacon on the open place -->
    <g mask="url(#beamFade)">
      <rect x="190" y="20" width="132" height="370" fill="#ffcf4a" opacity="0.6" filter="url(#blur16)"/>
      <rect x="220" y="20" width="72" height="370" fill="url(#beamX)"/>
      <rect x="250" y="20" width="12" height="370" fill="#fffdf2" opacity="0.5" filter="url(#blur5)"/>
    </g>

    <!-- the party: four already there -->
    <g transform="translate(88 300) scale(0.46) translate(-256 -360)">
      <path d="M232 236 C196 240 176 258 172 292 L164 354 A92 20 0 0 0 348 354 L340 292 C336 258 316 240 280 236 Z" fill="url(#companion)" stroke="#020a07" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="256" cy="184" r="46" fill="url(#companion)" stroke="#020a07" stroke-width="12"/>
    </g>
    <g transform="translate(424 300) scale(0.46) translate(-256 -360)">
      <path d="M232 236 C196 240 176 258 172 292 L164 354 A92 20 0 0 0 348 354 L340 292 C336 258 316 240 280 236 Z" fill="url(#companion)" stroke="#020a07" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="256" cy="184" r="46" fill="url(#companion)" stroke="#020a07" stroke-width="12"/>
    </g>
    <g transform="translate(148 322) scale(0.56) translate(-256 -360)">
      <path d="M232 236 C196 240 176 258 172 292 L164 354 A92 20 0 0 0 348 354 L340 292 C336 258 316 240 280 236 Z" fill="url(#companion)" stroke="#020a07" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="256" cy="184" r="46" fill="url(#companion)" stroke="#020a07" stroke-width="12"/>
    </g>
    <g transform="translate(364 322) scale(0.56) translate(-256 -360)">
      <path d="M232 236 C196 240 176 258 172 292 L164 354 A92 20 0 0 0 348 354 L340 292 C336 258 316 240 280 236 Z" fill="url(#companion)" stroke="#020a07" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="256" cy="184" r="46" fill="url(#companion)" stroke="#020a07" stroke-width="12"/>
    </g>
    <rect x="0" y="260" width="512" height="300" fill="url(#haze)"/>

    <!-- where the light meets the ground -->
    <ellipse cx="256" cy="354" rx="131" ry="38" fill="url(#pool)"/>
    <ellipse cx="256" cy="354" rx="92" ry="25" fill="none" stroke="#ffc83a" stroke-width="12" filter="url(#blur5)"/>
    <ellipse cx="256" cy="354" rx="92" ry="25" fill="none" stroke="#fff0b8" stroke-width="5"/>

    <g fill="#fff3c4">
      <circle cx="226" cy="118" r="3.5" opacity="0.85"/>
      <circle cx="292" cy="104" r="2.5" opacity="0.7"/>
      <circle cx="304" cy="168" r="3" opacity="0.6"/>
    </g>
  </g>

  <!-- the four already in, each with their role -->
  <g clip-path="url(#inside)">
    <g transform="translate(88 326) scale(1.333)">
      <circle r="18.5" fill="#020a07"/>
      <circle r="16" fill="url(#face_dps)" stroke="url(#badgeRim)" stroke-width="3.4"/>
      <g transform="rotate(45) translate(0 -0.5)"><path d="M-3.6 3.5 V-8.5 L0 -14.5 L3.6 -8.5 V3.5 Z" fill="url(#symbol)" stroke="#1c0404" stroke-width="2.2" stroke-linejoin="round"/><path d="M0 -14.5 L3.6 -8.5 V3.5 H0 Z" fill="#1c0404" opacity="0.18"/><rect x="-8.5" y="3.2" width="17" height="4.4" rx="1.6" fill="url(#symbol)" stroke="#1c0404" stroke-width="2"/><rect x="-2" y="7.4" width="4" height="5" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/><circle cx="0" cy="14" r="2.8" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/></g>
    </g>
    <g transform="translate(148 356) scale(1.500)">
      <circle r="18.5" fill="#020a07"/>
      <circle r="16" fill="url(#face_tank)" stroke="url(#badgeRim)" stroke-width="3.4"/>
      <path d="M-9.5 -10.5 H9.5 V-2 C9.5 6 5 10.5 0 13.5 C-5 10.5 -9.5 6 -9.5 -2 Z" fill="url(#symbol)" stroke="#06121c" stroke-width="2.4" stroke-linejoin="round"/><path d="M0 -10.5 V13.5 C5 10.5 9.5 6 9.5 -2 V-10.5 Z" fill="#06121c" opacity="0.18"/>
    </g>
    <g transform="translate(364 356) scale(1.500)">
      <circle r="18.5" fill="#020a07"/>
      <circle r="16" fill="url(#face_healer)" stroke="url(#badgeRim)" stroke-width="3.4"/>
      <path d="M-3.8 -11 H3.8 V-3.8 H11 V3.8 H3.8 V11 H-3.8 V3.8 H-11 V-3.8 H-3.8 Z" fill="url(#symbol)" stroke="#04140a" stroke-width="2.4" stroke-linejoin="round"/>
    </g>
    <g transform="translate(424 326) scale(1.333)">
      <circle r="18.5" fill="#020a07"/>
      <circle r="16" fill="url(#face_dps)" stroke="url(#badgeRim)" stroke-width="3.4"/>
      <g transform="rotate(45) translate(0 -0.5)"><path d="M-3.6 3.5 V-8.5 L0 -14.5 L3.6 -8.5 V3.5 Z" fill="url(#symbol)" stroke="#1c0404" stroke-width="2.2" stroke-linejoin="round"/><path d="M0 -14.5 L3.6 -8.5 V3.5 H0 Z" fill="#1c0404" opacity="0.18"/><rect x="-8.5" y="3.2" width="17" height="4.4" rx="1.6" fill="url(#symbol)" stroke="#1c0404" stroke-width="2"/><rect x="-2" y="7.4" width="4" height="5" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/><circle cx="0" cy="14" r="2.8" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/></g>
    </g>
  </g>

  <!-- you, the third DPS -->
  <g transform="translate(256 350) scale(0.82) translate(-256 -360)">
      <path d="M232 236 C196 240 176 258 172 292 L164 354 A92 20 0 0 0 348 354 L340 292 C336 258 316 240 280 236 Z" fill="url(#heroGold)" stroke="#1c0e02" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="256" cy="184" r="46" fill="url(#heroGold)" stroke="#1c0e02" stroke-width="9"/>
      <path d="M224 160 A40 40 0 0 1 252 142" fill="none" stroke="#fffbe8" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
      <path d="M190 300 C192 272 204 256 226 250" fill="none" stroke="#fffbe8" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    </g>
  <g transform="translate(256 394) scale(1.778)">
      <circle r="24" fill="#ffd35a" opacity="0.55" filter="url(#blur5)"/><circle r="18.5" fill="#020a07"/>
      <circle r="16" fill="url(#face_dps)" stroke="url(#badgeRimLit)" stroke-width="3.4"/>
      <g transform="rotate(45) translate(0 -0.5)"><path d="M-3.6 3.5 V-8.5 L0 -14.5 L3.6 -8.5 V3.5 Z" fill="url(#symbol)" stroke="#1c0404" stroke-width="2.2" stroke-linejoin="round"/><path d="M0 -14.5 L3.6 -8.5 V3.5 H0 Z" fill="#1c0404" opacity="0.18"/><rect x="-8.5" y="3.2" width="17" height="4.4" rx="1.6" fill="url(#symbol)" stroke="#1c0404" stroke-width="2"/><rect x="-2" y="7.4" width="4" height="5" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/><circle cx="0" cy="14" r="2.8" fill="url(#symbol)" stroke="#1c0404" stroke-width="1.8"/></g>
    </g>
</svg>
